<style>
:root{--bg:#02050f;--ln:#3fb4ff;--tx:#dff4ff;--dim:#6f8fb0;--red:#ff4d6a;--ok:#5dffb0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 55% at 50% 0,#0b2250 0,var(--bg) 62%) no-repeat;color:var(--tx);font:600 17px/1.35 Rajdhani,system-ui,sans-serif;padding-bottom:90px;min-height:100vh}
.top{text-align:center;padding:8px 0 0}.logo{width:190px;mix-blend-mode:screen}
.win{margin:10px 12px;border:1px solid var(--ln);background:rgba(4,12,32,.78);box-shadow:0 0 16px rgba(63,180,255,.45),inset 0 0 24px rgba(63,180,255,.12);padding:14px}
.ttl{border:1px solid var(--ln);text-align:center;letter-spacing:.22em;padding:8px;font-size:21px;text-shadow:0 0 10px var(--ln);margin-bottom:12px}
.c{text-align:center;margin:8px 0}.dim{color:var(--dim);font-size:15px}.ok{color:var(--ok);text-shadow:0 0 10px var(--ok)}
.goal{font-size:24px;letter-spacing:.2em;text-decoration:underline;text-shadow:0 0 10px var(--ln);margin:14px 0 8px}
.warn{margin-top:18px;font-size:15px}.warn b{color:#8fdcff;text-shadow:0 0 8px var(--ln)}
.pen{border:1px solid var(--red);color:var(--red);padding:8px;text-align:center;margin:8px 0;text-shadow:0 0 8px var(--red)}
h3{margin:16px 0 4px;color:#8fdcff;letter-spacing:.14em;font-size:17px;text-shadow:0 0 8px var(--ln)}
.r{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(63,180,255,.16)}
.b{width:34px;height:34px;margin-left:8px;border:1.5px solid var(--ln);background:none;border-radius:3px;color:var(--ok);font:700 20px/1 inherit;padding:0}
.b.on{background:rgba(63,180,255,.28);box-shadow:0 0 10px var(--ln)}
.bar{height:11px;border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2a7bff,#4fd8ff);box-shadow:0 0 10px var(--ln)}
.lbl{display:flex;justify-content:space-between;margin-top:10px}
.lv{text-align:center;margin:6px 0}.lv b{display:block;font-size:76px;line-height:1;text-shadow:0 0 18px var(--ln)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.st{border:1px solid rgba(63,180,255,.45);padding:10px;font-size:19px}.st b{float:right;text-shadow:0 0 8px var(--ln)}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mn button{background:none;border:1px solid var(--ln);color:var(--tx);width:38px;height:34px;font:700 20px inherit}
.rk{text-align:center;font-size:96px;line-height:1;font-weight:700;color:var(--ok);text-shadow:0 0 22px var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.cal div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:15px;border:1px solid transparent;color:var(--dim)}
.cal .h{aspect-ratio:auto;border:0}
.cal .d{background:rgba(63,180,255,.35);color:#fff;border-color:var(--ln);box-shadow:0 0 8px var(--ln)}
.cal .m{background:rgba(255,77,106,.25);color:#fff;border-color:var(--red)}
.cal .r{border-color:#3b4a60;display:flex;padding:0}.cal .p{border-color:var(--tx);color:var(--tx)}.cal .f{opacity:.35}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:#030a1c;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;color:var(--dim);padding:16px 0;font:700 17px inherit;letter-spacing:.16em}
nav .on{color:#fff;text-shadow:0 0 12px var(--ln);box-shadow:inset 0 2px 0 var(--ln)}

<script>
const PLAN=[
{n:'Warm Up',s:'AGI',x:[['Arm circle','30 sec',1],['Jumping jacks','×30',1],['High knees','×30',1],['Shoulder rotations','×15',1],['Light stretch','20 sec',1]]},
{n:'Chest',s:'STR',x:[['Decline push-ups','2×5',2],['Push-ups','2×5',2],['Diamond push-ups','2×5',2]]},
{n:'Back',s:'STR',x:[['Backpack rows','2×10',2],['Door frame rows','2×8',2],['Pull-ups','2×max',2]]},
{n:'Shoulders',s:'PER',x:[['Pike push-ups','1×5',1],['Lateral raises (bottles)','2×10',2],['Rear delt fly (bottles)','2×10',2]]},
{n:'Arms',s:'STR',x:[['Bench dips','2×10',2],['Backpack hammer curls','2×10',2],['Diamond push-ups','2×5',2]]},
{n:'Legs',s:'AGI',x:[['Squats','2×10',2],['Reverse lunges','2×10',2],['Calf raises','2×15',2]]},
{n:'Core',s:'VIT',x:[['Reverse crunch','2×5',2],['Plank','20 sec',1],['Mountain climbers','2×20 sec',2],['Bicycle crunch','2×5',2]]}];
const $=s=>document.querySelector(s);
let AC;
function sfx(t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
 const N={tab:[[1175,0,.08],[1760,.07,.18]],tick:[[698,0,.06,'triangle'],[1047,.05,.2,'triangle']],off:[[392,0,.12,'triangle']],clear:[[523,0,.16],[659,.13,.16],[784,.26,.16],[1047,.39,.7]]}[t];
 N.forEach(([f,d,l,w])=>{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+d;o.type=w||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.2,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+l);
  o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+l+.05)})}catch(e){}}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
let S;try{S=JSON.parse(localStorage.getItem('sl1'))}catch(e){}
if(!S||!S.log)S={start:ymd(new Date()),log:{},seen:''};
const save=()=>{try{localStorage.setItem('sl1',JSON.stringify(S))}catch(e){}};
const TOTAL=PLAN.reduce((a,g)=>a+g.x.reduce((b,e)=>b+e[2],0),0);
const done=k=>(S.log[k]||[]).length,isDone=k=>done(k)>=TOTAL;
function calc(){let sets=0,days=0,miss=0,st={STR:0,AGI:0,VIT:0,PER:0};
 for(const k in S.log){S.log[k].forEach(id=>{sets++;st[PLAN[id.split('.')[0]].s]++});if(isDone(k))days++}
 const t=ymd(new Date());
 for(let d=pd(S.start);ymd(d)<t;d.setDate(d.getDate()+1))if(d.getDay()&&!isDone(ymd(d)))miss++;
 const xp=Math.max(0,sets*5+days*50-miss*100);return{sets,days,miss,st,xp,lv:1+Math.floor(Math.sqrt(xp/40))}}
function streak(){let n=0,d=new Date();if(!isDone(ymd(d)))d.setDate(d.getDate()-1);
 for(;;d.setDate(d.getDate()-1)){if(!d.getDay())continue;if(ymd(d)>=S.start&&isDone(ymd(d)))n++;else break}return n}
function mstat(y,m){const n=new Date(y,m+1,0).getDate(),t=ymd(new Date()),a=[];let d0=0,mi=0,r=0,sets=0;
 for(let i=1;i<=n;i++){const dt=new Date(y,m,i),k=ymd(dt);let s;
  if(k<S.start||k>t)s='f';else if(!dt.getDay())s='r';else if(isDone(k))s='d';else s=k===t?'p':'m';
  if(s=='d')d0++;if(s=='m')mi++;if(s=='r')r++;sets+=done(k);a.push(s)}
 return{a,d0,mi,r,sets,first:new Date(y,m,1).getDay()}}
function quest(){const n=new Date(),k=ymd(n),L=S.log[k]||[];
 let h='<div class="win"><div class="ttl">QUEST INFO</div>';
 const y=new Date(n);y.setDate(y.getDate()-1);
 if(y.getDay()&&ymd(y)>=S.start&&!isDone(ymd(y)))h+='<p class="pen">PENALTY: yesterday’s quest was not completed. −100 XP.</p>';
 h+='<p class="c dim">'+n.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+'</p>';
 if(!n.getDay())return h+'<p class="c ok" style="font-size:26px">[Rest Day]</p><p class="c">Recovery is part of the quest. No quest and no penalty today. The next Daily Quest arrives tomorrow.</p></div>';
 h+='<p class="c">[Daily Quest: Strength Training has arrived.]</p><h2 class="c goal">GOAL</h2>';
 h+='<div class="bar"><i style="width:'+L.length/TOTAL*100+'%"></i></div><p class="c dim">'+L.length+' / '+TOTAL+' sets</p>';
 if(L.length>=TOTAL)h+='<p class="c ok">[Daily Quest: Completed]<br>+'+(TOTAL*5+50)+' XP</p>';
 PLAN.forEach((g,gi)=>{h+='<h3>'+g.n.toUpperCase()+'</h3>';g.x.forEach((e,xi)=>{
  h+='<div class="r"><div><div>'+e[0]+'</div><div class="dim">'+e[1]+'</div></div><div>';
  for(let s=0;s<e[2];s++){const id=gi+'.'+xi+'.'+s,on=L.includes(id);h+='<button class="b'+(on?' on':'')+'" data-k="'+id+'">'+(on?'✓':'')+'</button>'}
  h+='</div></div>'})});
 return h+'<p class="c warn"><b>WARNING:</b> Failure to complete the daily quest will result in an appropriate penalty.</p></div>'}
function status(){const c=calc(),lv=c.lv,a=40*(lv-1)**2,b=40*lv*lv,
 T=[[1,'The Weakest Hunter'],[5,'Wolf Assassin'],[10,'The One Who Overcame Adversity'],[20,'Shadow Monarch']],
 t=T.filter(x=>lv>=x[0]).pop()[1],hp=100+lv*20,pc=Math.max(20,100-c.miss*10),
 st=(l,v)=>'<div class="st">'+l+': <b>'+v+'</b></div>';
 return '<div class="win"><div class="ttl">STATUS</div><div class="lv"><b>'+lv+'</b>LEVEL</div>'+
 '<p class="c">JOB: <b>'+(lv>=20?'Shadow Monarch':'None')+'</b><br>TITLE: <b>'+t+'</b></p>'+
 '<div class="lbl"><span>HP</span><span class="dim">'+Math.round(hp*pc/100)+'/'+hp+'</span></div><div class="bar"><i style="width:'+pc+'%"></i></div>'+
 '<div class="lbl"><span>EXP</span><span class="dim">'+c.xp+' / '+b+'</span></div><div class="bar"><i style="width:'+(c.xp-a)/(b-a)*100+'%"></i></div>'+
 '<div class="lbl"><span>FATIGUE</span><b>'+c.miss+'</b></div>'+
 '<div class="sg">'+st('STR',10+(c.st.STR>>2))+st('VIT',10+(c.st.VIT>>2))+st('AGI',10+(c.st.AGI>>2))+st('INT',10+c.days)+st('PER',10+(c.st.PER>>2))+st('STREAK',streak())+'</div>'+
 '<p class="c dim" style="margin-top:14px">'+c.days+' quests cleared · '+c.sets+' sets done</p></div>'}
function report(){const n=new Date(),{y,m}=RM,s=mstat(y,m),pl=s.d0+s.mi,p=pl?Math.round(s.d0/pl*100):0,
 g=!pl?'–':p>=95?'S':p>=80?'A':p>=60?'B':p>=40?'C':p>=20?'D':'E',end=new Date(y,m+1,0),fin=ymd(end)<=ymd(n),
 M={S:'You have surpassed your limits.',A:'Excellent. The Monarch approves.',B:'Good progress. Push harder.',C:'Average. The system expects more.',D:'Weak. Penalty territory.',E:'Failure. Rise again next month.','–':'No quests recorded this month.'};
 let h='<div class="win"><div class="ttl">MONTHLY RESULT</div><div class="mn"><button data-m="-1">‹</button><b>'+new Date(y,m,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</b><button data-m="1">›</button></div>';
 h+=fin?'<p class="c ok">[Monthly Result has arrived]</p>':'<p class="c dim">Month in progress. The final result arrives on the last day.</p>';
 h+='<div class="rk">'+g+'</div><p class="c dim">'+(fin?'FINAL RANK':'CURRENT RANK')+'</p><p class="c">'+M[g]+'</p>';
 h+='<div class="cal">'+'SMTWTFS'.split('').map(x=>'<div class="h">'+x+'</div>').join('')+'<div class="h"></div>'.repeat(s.first)+s.a.map((x,i)=>'<div class="'+x+'">'+(x=='r'?'R':i+1)+'</div>').join('')+'</div>';
 h+='<div class="sg">'+[['CLEARED',s.d0+' / '+pl],['COMPLETION',p+'%'],['MISSED',s.mi],['REST DAYS',s.r],['SETS DONE',s.sets]].map(x=>'<div class="st">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div></div>';
 return h}
let tab='q',RM={y:new Date().getFullYear(),m:new Date().getMonth()};
(function(){const n=new Date(),pm=new Date(n.getFullYear(),n.getMonth()-1,1),pk=pm.getFullYear()+'-'+(pm.getMonth()+1);
 if(S.seen!==pk&&ymd(new Date(pm.getFullYear(),pm.getMonth()+1,0))>=S.start){tab='r';RM={y:pm.getFullYear(),m:pm.getMonth()}}
 S.seen=pk;save()})();
function draw(){const y=scrollY;$('#app').innerHTML={q:quest,s:status,r:report}[tab]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));scrollTo(0,y)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-k],[data-t],[data-m]');if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;scrollTo(0,0);sfx('tab')}
 else if(b.dataset.m){const d=new Date(RM.y,RM.m+ +b.dataset.m,1),n=new Date();
  if(d>new Date(n.getFullYear(),n.getMonth(),1))return;RM={y:d.getFullYear(),m:d.getMonth()};sfx('tab')}
 else{const k=ymd(new Date()),L=S.log[k]||(S.log[k]=[]),i=L.indexOf(b.dataset.k);i<0?L.push(b.dataset.k):L.splice(i,1);save();navigator.vibrate&&navigator.vibrate(15);sfx(i>=0?'off':L.length>=TOTAL?'clear':'tick')}
 draw()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
